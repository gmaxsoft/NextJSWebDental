# Nginx – stomatolog-dentysta.pl
# Skopiuj na serwer:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/stomatolog-dentysta.pl
#   sudo ln -s /etc/nginx/sites-available/stomatolog-dentysta.pl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certyfikat SSL (Let's Encrypt):
#   sudo certbot --nginx -d www.stomatolog-dentysta.pl -d stomatolog-dentysta.pl
#
# Aplikacja Next.js nasłuchuje na 127.0.0.1:3000 (PM2).

upstream nextjs_stomatolog {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS + wymuszenie www
server {
    listen 80;
    listen [::]:80;
    server_name stomatolog-dentysta.pl www.stomatolog-dentysta.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.stomatolog-dentysta.pl$request_uri;
    }
}

# HTTPS bez www → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stomatolog-dentysta.pl;

    ssl_certificate     /etc/letsencrypt/live/stomatolog-dentysta.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stomatolog-dentysta.pl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.stomatolog-dentysta.pl$request_uri;
}

# Główny vhost
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stomatolog-dentysta.pl;

    ssl_certificate     /etc/letsencrypt/live/stomatolog-dentysta.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stomatolog-dentysta.pl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10m;

    # === Nagłówki bezpieczeństwa (dawniej .htaccess) ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), midi=(), sync-xhr=(), accelerometer=(), gyroscope=(), magnetometer=(), camera=(self), fullscreen=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # === index.php / index.html → strona główna ===
    location ~ ^/index\.(php|html)$ {
        return 301 https://www.stomatolog-dentysta.pl/;
    }

    # === Stare URL-e WordPress / spam ===
    location = /wp-content/uploads/2021/06/5196-Cheap-Swiss-Made-RolexReplica-Ebay.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }
    location = /wp-content/uploads/2021/06/RolexReplica-Ebay-Cheap-Swiss-Made-For-Sale-In-Cleveland-Ohio.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }
    location = /wp-content/uploads/2021/06/Cheap-Swiss-Made-Sold-In-Retail-Stores-RolexReplica-Ebay.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }

    # === Blokada plików wrażliwych ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|git|gitignore|htaccess|htpasswd|log|sql|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* ^/(package(-lock)?\.json|README\.md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache dla statycznych assetów Next.js
    location /_next/static/ {
        proxy_pass http://nextjs_stomatolog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Yandex maps query → strona główna
        if ($args ~ "(^|&)yandex-source=desktop-maps(&|$)") {
            return 301 https://www.stomatolog-dentysta.pl/;
        }

        # Stary parametr dentystastomatolog
        if ($args ~ "(^|&)dentystastomatolog=3(&|$)") {
            return 301 https://www.stomatolog-dentysta.pl/;
        }

        # Trailing slash (ścieżki bez rozszerzenia; bez _next i api)
        rewrite ^(?!/_next|/api)([^.]*[^/])$ $1/ permanent;

        proxy_pass http://nextjs_stomatolog;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
