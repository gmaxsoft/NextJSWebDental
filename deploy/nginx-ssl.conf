# Nginx – stomatolog-dentysta.pl (HTTPS)
# Wgraj DOPIERO gdy certyfikat już istnieje:
#   sudo ls /etc/letsencrypt/live/
# Jeśli katalog to www.stomatolog-dentysta.pl, zmień ścieżki ssl_certificate poniżej.
#
#   sudo cp deploy/nginx-ssl.conf /etc/nginx/sites-available/stomatolog-dentysta.pl
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP/2: dyrektywa "http2 on;" (nie "listen ... http2")

upstream nextjs_stomatolog {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name stomatolog-dentysta.pl www.stomatolog-dentysta.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.stomatolog-dentysta.pl$request_uri;
    }
}

# HTTPS bez www → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stomatolog-dentysta.pl;

    ssl_certificate     /etc/letsencrypt/live/stomatolog-dentysta.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stomatolog-dentysta.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://www.stomatolog-dentysta.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.stomatolog-dentysta.pl;

    ssl_certificate     /etc/letsencrypt/live/stomatolog-dentysta.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stomatolog-dentysta.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), midi=(), sync-xhr=(), accelerometer=(), gyroscope=(), magnetometer=(), camera=(self), fullscreen=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location ~ ^/index\.(php|html)$ {
        return 301 https://www.stomatolog-dentysta.pl/;
    }

    location = /wp-content/uploads/2021/06/5196-Cheap-Swiss-Made-RolexReplica-Ebay.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }
    location = /wp-content/uploads/2021/06/RolexReplica-Ebay-Cheap-Swiss-Made-For-Sale-In-Cleveland-Ohio.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }
    location = /wp-content/uploads/2021/06/Cheap-Swiss-Made-Sold-In-Retail-Stores-RolexReplica-Ebay.html {
        return 301 https://www.stomatolog-dentysta.pl/;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|git|gitignore|htaccess|htpasswd|log|sql|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* ^/(package(-lock)?\.json|README\.md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /_next/static/ {
        proxy_pass http://nextjs_stomatolog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        if ($args ~ "(^|&)yandex-source=desktop-maps(&|$)") {
            return 301 https://www.stomatolog-dentysta.pl/;
        }
        if ($args ~ "(^|&)dentystastomatolog=3(&|$)") {
            return 301 https://www.stomatolog-dentysta.pl/;
        }

        rewrite ^(?!/_next|/api)([^.]*[^/])$ $1/ permanent;

        proxy_pass http://nextjs_stomatolog;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
